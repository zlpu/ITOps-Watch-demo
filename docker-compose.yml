services:
  nginx:
    image: registry.cn-chengdu.aliyuncs.com/pzl_devops/nginx:alpine
    container_name: itopswatch-nginx
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - itopswatch-web
      - itopswatch-api
    restart: unless-stopped
    network_mode: "host"

  # 前端Web服务
  itopswatch-web:
    image: registry.cn-chengdu.aliyuncs.com/pzl_devops/itopswatch-web:7.6-pro-0806
    pull_policy: always
    container_name: itopswatch-web
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: "host"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  itopswatch-api:
    image: registry.cn-chengdu.aliyuncs.com/pzl_devops/itopswatch-api-en:7.6-pro-0806
    pull_policy: always
    container_name: itopswatch-api
    user: root
    environment:
      TZ: Asia/Shanghai
      API_PORT: "5001"
      ITOPSWATCH_TRUSTED_PROXIES: "${ITOPSWATCH_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}"
      ITOPSWATCH_TRUST_ALL_FORWARDED_IPS: "${ITOPSWATCH_TRUST_ALL_FORWARDED_IPS:-true}"
      ITOPSWATCH_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ITOPSWATCH_ALLOW_ALL_OUTBOUND: "true"
      ITOPSWATCH_MAX_PROXY_RESPONSE_BYTES: "2097152"
      ITOPSWATCH_REMEMBER_LOGIN_DAYS: "30"
      ITOPSWATCH_COOKIE_SECURE: auto
      ITOPSWATCH_ALLOW_ADMIN_BOOTSTRAP: "true"
      ITOPSWATCH_BOOTSTRAP_ADMIN_USERNAME: admin
      ITOPSWATCH_BOOTSTRAP_ADMIN_PASSWORD: itops-watch1
      ITOPSWATCH_ACTIVATION_STATE_DIR: /app/.sys_cache
    volumes:
      - /sys/class/dmi/id/product_uuid:/usr/local/log1:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
      - itopswatch-license-state:/app/.sys_cache
      - itopswatch-topology-files:/app/topology_files
      - itopswatch-topology-icons:/app/topology_icons
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    network_mode: "host"

  mysql:
    image: registry.cn-chengdu.aliyuncs.com/pzl_devops/itopswatch-db:7.6-pro-0806
    pull_policy: always
    container_name: itopswatch-db
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data71:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    restart: unless-stopped
    network_mode: "host"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  itopswatch-license-state:
    name: itopswatch-license-state
  itopswatch-topology-files:
    name: itopswatch-topology-files
  itopswatch-topology-icons:
    name: itopswatch-topology-icons
